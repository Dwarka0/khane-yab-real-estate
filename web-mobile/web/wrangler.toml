name = "khane-yab-web"
main = "src/worker.ts"
compatibility_date = "2026-10-19"

# The web client is published as a Worker with static assets so it is served
# from a workers.dev address, which stays reachable where pages.dev may be
# blocked. Every unknown path falls back to the single page application.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
