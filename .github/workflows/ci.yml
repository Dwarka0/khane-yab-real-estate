name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler d1 migrations apply khane-yab-platform --local
      - run: npx wrangler deploy --dry-run
      - run: npm audit --audit-level=moderate

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-mobile/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-mobile/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-mobile/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-mobile/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run assets:generate
      - run: npm run assets:web
      - run: npx expo export --platform android
      - name: Export the installable web build
        run: npm run export:web
        env:
          EXPO_PUBLIC_API_BASE_URL: https://real-estate-platform-api.m-abner-9907.workers.dev
      - name: Report known Expo/Metro advisories
        run: npm audit --audit-level=high
        continue-on-error: true
